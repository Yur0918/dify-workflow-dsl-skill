app:
  name: "客服问答（fixture）"
  description: "Validator fixture: advanced-chat chatflow with a code node."
  icon: "💬"
  icon_type: emoji
  icon_background: "#FFEAD5"
  mode: advanced-chat
  use_icon_as_answer_icon: false
kind: app
version: "0.6.0"
dependencies: []
workflow:
  conversation_variables:
    - description: ""
      id: 7a9ac6e3-0000-4000-9000-000000000001
      name: Memory
      selector: [conversation, Memory]
      value: ""
      value_type: string
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: "2000001-source-2000002-target"
      source: "2000001"
      sourceHandle: source
      target: "2000002"
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: "2000002-source-2000003-target"
      source: "2000002"
      sourceHandle: source
      target: "2000003"
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: "2000003-source-2000004-target"
      source: "2000003"
      sourceHandle: source
      target: "2000004"
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        title: "开始"
        type: start
        variables:
          - label: "用户输入"
            variable: user_input
            type: paragraph
            required: true
            max_length: 2000
      height: 120
      id: "2000001"
      position: { x: 30, y: 300 }
      positionAbsolute: { x: 30, y: 300 }
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        title: "清洗输入"
        type: code
        code_language: python3
        code: |
          def main(user_input: str) -> dict:
              return {"clean_input": user_input.strip()}
        outputs:
          clean_input:
            type: string
      height: 98
      id: "2000002"
      position: { x: 334, y: 300 }
      positionAbsolute: { x: 334, y: 300 }
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        title: "生成回答"
        type: llm
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
        prompt_template:
          - id: "c3d4e5f6-a7b8-9012-cdef-234567890123"
            role: system
            text: "你是耐心客服，用中文回答。"
          - id: "d4e5f6a7-b8c9-0123-defa-345678901234"
            role: user
            text: "{{#2000002.clean_input#}}"
        context:
          enabled: false
          variable_selector: []
        variables: []
        vision:
          enabled: false
      height: 98
      id: "2000003"
      position: { x: 638, y: 300 }
      positionAbsolute: { x: 638, y: 300 }
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        title: "直接回复"
        type: answer
        answer: "{{#2000003.text#}}"
      height: 90
      id: "2000004"
      position: { x: 942, y: 300 }
      positionAbsolute: { x: 942, y: 300 }
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport: { x: 50, y: 200, zoom: 0.8 }
